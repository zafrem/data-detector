name: CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pii-pattern-engine/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pii-pattern-engine/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax-check:
    name: Syntax and Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff (Syntax & Lint)
        run: ruff check src/ tests/

      - name: Run black check (Formatting)
        run: black --check src/ tests/

      - name: Run mypy (Type Check)
        run: mypy src/

      - name: Validate Patterns
        run: python -c "from datadetector import load_registry; load_registry(validate_examples=True); print('All patterns valid')"

      - name: Check api/pii-pattern-engine in sync with submodule
        run: |
          diff -rq pii-pattern-engine/regex api/pii-pattern-engine/regex --exclude='.git*' --exclude='__pycache__' || \
            { echo "ERROR: api/pii-pattern-engine is out of sync with the pii-pattern-engine submodule."; \
              echo "Run: ./scripts/sync-patterns.sh"; exit 1; }
          diff -rq pii-pattern-engine/verification api/pii-pattern-engine/verification --exclude='.git*' --exclude='__pycache__' || \
            { echo "ERROR: api/pii-pattern-engine/verification is out of sync."; \
              echo "Run: ./scripts/sync-patterns.sh"; exit 1; }

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: syntax-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest --cov=datadetector --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests

  cjk-test:
    name: CJK Multi-Language Detection
    needs: syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install with NLP dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,nlp]"

      - name: Run CJK pattern tests
        run: pytest tests/test_cjk_patterns.py tests/test_nlp.py -v --tb=short

      - name: Run CJK integration tests
        run: |
          python -c "
          from datadetector import Engine, load_registry, NLPConfig

          reg = load_registry()
          engine = Engine(reg, nlp_config=NLPConfig(
              enable_language_detection=True,
              enable_tokenization=True,
              enable_korean_particles=True,
              enable_chinese_segmentation=True,
          ))

          # Korean: phone with particle
          r = engine.find('전화번호는 010-1234-5678입니다', namespaces=['kr'])
          assert r.has_matches, 'Korean phone with particle not detected'
          print(f'Korean phone: {r.match_count} matches')

          # Chinese: mobile number
          r = engine.find('我的手机号是13812345678', namespaces=['cn'])
          assert r.has_matches, 'Chinese mobile not detected'
          print(f'Chinese mobile: {r.match_count} matches')

          # Japanese: phone number
          r = engine.find('電話番号は090-1234-5678です', namespaces=['jp'])
          assert r.has_matches, 'Japanese phone not detected'
          print(f'Japanese phone: {r.match_count} matches')

          # Korean: RRN with particle
          r = engine.find('주민등록번호는 900101-1234568입니다', namespaces=['kr'])
          assert r.has_matches, 'Korean RRN with particle not detected'
          print(f'Korean RRN: {r.match_count} matches')

          # Multi-namespace CJK scan
          text = '이메일: test@example.com 전화: 010-9876-5432'
          r = engine.find(text, namespaces=['kr', 'comm'])
          assert r.match_count >= 2, f'Multi-namespace CJK: expected >= 2, got {r.match_count}'
          print(f'Multi-namespace: {r.match_count} matches')

          print('All CJK integration tests passed')
          "
